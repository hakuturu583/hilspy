[workspace]
resolver = "2"
members = ["crates/hilspy-core", "crates/hilspy-python"]

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/hakuturu583/hilspy"

[workspace.dependencies]
hilspy-core = { path = "crates/hilspy-core" }
can-dbc = "10.0.0"
afibex = "0.11"
roxmltree = "0.21"
libsbf = "0.18.0"
socketcan = { version = "4.0.0", default-features = false, features = ["dump"] }
thiserror = "2"
nmea = { version = "0.8", default-features = false, features = ["std", "all-sentences", "serde"] }
ublox = { version = "0.10", default-features = false, features = ["std", "alloc", "serde", "ubx_proto23"] }
rtcm-rs = { version = "0.11", default-features = false, features = ["std", "all_msgs", "serde"] }
serde_json = "1"
autosar-e2e = "1"
blf_asc = "0.2"
rand = "0.8"
serialport = { version = "4.10", default-features = false }
pyo3 = "0.29"
prost = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
protox = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
