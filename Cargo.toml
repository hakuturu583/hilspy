[workspace]
resolver = "2"
members = ["crates/hilspy-core", "crates/hilspy-python"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.83"
license = "Apache-2.0"
repository = "https://github.com/hakuturu583/hilspy"

[workspace.dependencies]
hilspy-core = { path = "crates/hilspy-core" }
can-dbc = "10.0.0"
libsbf = "0.18.0"
socketcan = { version = "4.0.0", default-features = false }
thiserror = "2"
serialport = { version = "4.10", default-features = false }
pyo3 = "0.29"
prost = "0.14"
prost-build = "0.14"
prost-reflect = { version = "0.16", features = ["text-format"] }
protox = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
