[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "hilspy"
description = "HILS I/O for Python on a Rust core: CAN/CAN FD over SocketCAN (vcan) or an in-process virtual bus, DBC encoding, and Septentrio Binary Format (SBF) parsing"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Masaya Kataoka", email = "ms.kataoka@gmail.com" }]
keywords = ["hils", "can", "socketcan", "vcan", "dbc", "sbf", "septentrio", "gnss"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/hakuturu583/hilspy"

[dependency-groups]
dev = [
    "maturin>=1.9,<2",
    "pytest>=8",
    "mypy>=1.11",
    "ruff>=0.6",
    "cantools>=39",
    "pre-commit>=3.7",
]

[tool.maturin]
manifest-path = "crates/hilspy-python/Cargo.toml"
python-source = "python"
module-name = "hilspy._hilspy"
features = ["extension-module"]

[tool.uv]
# Rebuild the extension when the Rust sources change.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/**/*.rs" },
    { file = "crates/**/Cargo.toml" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["python/hilspy", "tests", "examples"]

[tool.ruff.lint.isort]
known-first-party = ["hilspy"]
