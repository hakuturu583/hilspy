name: Release

# Merging a PR labelled "bump patch" / "bump minor" / "bump major" into the
# default branch bumps the version by the highest label among the PRs merged
# since the last release tag (tools/bump_version.py: pyproject.toml,
# Cargo.toml and both lockfiles), commits "chore: bump version to X", tags
# vX, builds the wheels and the sdist, creates the GitHub Release and
# publishes to PyPI (Trusted Publishing, environment "pypi").
#
# workflow_dispatch finishes the release of a version that was already bumped
# (when a later step failed): it builds from the tag vX, or else from the
# "chore: bump version to X" commit. Every step can be repeated: an existing
# tag, Release, asset or PyPI file is reused.
on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      version:
        description: Version to finish releasing, e.g. 0.2.0
        required: true
        type: string

permissions:
  contents: read

# Runs are serialized. GitHub keeps only the newest pending run of a group and
# cancels older pending ones, so a run never relies on its own commit alone:
# it releases everything merged since the last v* tag (see "Collect the bump
# labels"), which covers the merges of any run that was cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
      bump_type: ${{ steps.labels.outputs.bump_type }}
      pr_numbers: ${{ steps.labels.outputs.pr_numbers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The branch tip, not the triggering commit: merges that landed
          # while this run was pending are released by it too.
          ref: ${{ github.event_name == 'push' && github.ref_name || '' }}
          # A branch ruleset that blocks direct pushes needs a token allowed
          # to bypass it (secret GH_PAT); otherwise GITHUB_TOKEN is enough.
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: List the commits merged since the last release
        if: github.event_name == 'push'
        id: range
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' HEAD 2>/dev/null || true)
          echo "Last release tag: ${last:-(none)}"
          # First-parent history: one merge (or squash) commit per merged PR.
          commits=$(git rev-list --first-parent "${last:+${last}..}HEAD" | tr '\n' ' ')
          echo "commits=${commits}" >> "$GITHUB_OUTPUT"

      - name: Collect the bump labels of the PRs merged since then
        if: github.event_name == 'push'
        id: labels
        uses: actions/github-script@v7
        env:
          COMMITS: ${{ steps.range.outputs.commits }}
          BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const order = ['none', 'patch', 'minor', 'major'];
            const prs = new Map();
            for (const sha of process.env.COMMITS.split(' ').filter(Boolean)) {
              const { data } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                ...context.repo,
                commit_sha: sha,
              });
              for (const pr of data) {
                if (pr.merged_at && pr.base.ref === process.env.BRANCH) prs.set(pr.number, pr);
              }
            }
            let bump = 'none';
            for (const pr of prs.values()) {
              const labels = pr.labels.map(l => l.name);
              const own = ['major', 'minor', 'patch'].find(p => labels.includes(`bump ${p}`)) || 'none';
              core.info(`#${pr.number} ${pr.title}: ${own}`);
              if (order.indexOf(own) > order.indexOf(bump)) bump = own;
            }
            core.info(`Release: ${bump}`);
            core.setOutput('bump_type', bump);
            core.setOutput('pr_numbers', [...prs.keys()].sort((a, b) => a - b).join(' '));

      - uses: astral-sh/setup-uv@v6
        if: steps.labels.outputs.bump_type != 'none' && github.event_name == 'push'
      - uses: dtolnay/rust-toolchain@stable
        if: steps.labels.outputs.bump_type != 'none' && github.event_name == 'push'

      - name: Bump and commit
        if: steps.labels.outputs.bump_type != 'none' && github.event_name == 'push'
        id: bump
        env:
          BUMP: ${{ steps.labels.outputs.bump_type }}
          BRANCH: ${{ github.ref_name }}
        run: |
          version=$(uv run --no-project python tools/bump_version.py "$BUMP")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml Cargo.toml uv.lock Cargo.lock
          git commit -m "chore: bump version to ${version}"
          if ! git push origin "HEAD:${BRANCH}"; then
            # A merge landed after the checkout; it queued a newer run, which
            # releases this run's merges together with it.
            git fetch origin "${BRANCH}"
            if [ "$(git rev-parse "origin/${BRANCH}")" != "$(git rev-parse HEAD~1)" ]; then
              echo "::notice::${BRANCH} moved on; the next release run covers these merges."
              exit 0
            fi
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Resolve the version to release
        id: version
        env:
          EVENT: ${{ github.event_name }}
          BUMPED: ${{ steps.bump.outputs.version }}
          REQUESTED: ${{ inputs.version }}
        run: |
          read_version() {
            git show "$1:pyproject.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="${REQUESTED#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::'$REQUESTED' is not a version like 0.2.0"; exit 1
            fi
            if git rev-parse --verify --quiet "refs/tags/v${version}" > /dev/null; then
              sha=$(git rev-list -n 1 "v${version}")
            else
              sha=$(git log -1 --format=%H --grep="^chore: bump version to ${version//./\\.}\$")
            fi
            if [ -z "$sha" ] || [ "$(read_version "$sha")" != "$version" ]; then
              echo "::error::no v${version} tag or bump commit carrying ${version}"; exit 1
            fi
          elif [ -n "$BUMPED" ]; then
            version="$BUMPED"
            sha=$(git rev-parse HEAD)
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Releasing v${version} from ${sha}"
          {
            echo "release=true"
            echo "version=${version}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
          SHA: ${{ steps.version.outputs.sha }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "${TAG} already exists"
          else
            git tag "${TAG}" "${SHA}"
            git push origin "${TAG}"
          fi

  dist:
    needs: bump
    if: needs.bump.outputs.release == 'true'
    uses: ./.github/workflows/build-dist.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  github-release:
    needs: [bump, dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Create the Release (or add to it)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.bump.outputs.version }}
          BUMP: ${{ needs.bump.outputs.bump_type }}
          PRS: ${{ needs.bump.outputs.pr_numbers }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            notes="Install: \`pip install hilspy==${TAG#v}\`"
            if [ -n "$PRS" ]; then
              notes="${notes}"$'\n\n'"Released by $(printf '#%s ' $PRS)(bump ${BUMP})."
            fi
            gh release create "$TAG" --title "hilspy $TAG" --notes "$notes" --generate-notes
          fi
          gh release upload "$TAG" dist/* --clobber

  publish:
    needs: [bump, dist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/hilspy/${{ needs.bump.outputs.version }}/
    permissions:
      id-token: write  # Trusted Publishing; no token in secrets.
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
