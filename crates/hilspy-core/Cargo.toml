[package]
name = "hilspy-core"
description = "Rust core of hilspy: CAN buses (SocketCAN / virtual), DBC, FIBEX, SOME/IP, Septentrio Binary Format (SBF) and LiDAR (Hesai, Velodyne) codecs for HILS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
can-dbc.workspace = true
afibex.workspace = true
roxmltree.workspace = true
libsbf.workspace = true
prost.workspace = true
serialport.workspace = true
nmea.workspace = true
ublox.workspace = true
rtcm-rs.workspace = true
serde_json.workspace = true
autosar-e2e.workspace = true
blf_asc.workspace = true
thiserror.workspace = true
opentelemetry.workspace = true
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
sysinfo = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan.workspace = true
libc = "0.2"
gstreamer = { workspace = true, optional = true }
gstreamer-app = { workspace = true, optional = true }
gstreamer-video = { workspace = true, optional = true }

[features]
default = ["otlp"]
# Export the metrics over OTLP/HTTP when OTEL_EXPORTER_OTLP_ENDPOINT is set,
# with the host's CPU and memory load (see `telemetry`). Without it the
# metrics go to whatever global meter provider the program installs.
otlp = ["dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:sysinfo"]
# v4l2:// on Linux: frames through GStreamer into a V4L2 device
# (v4l2loopback). Off by default: it links the system GStreamer libraries,
# which the manylinux wheels cannot carry.
v4l2 = ["dep:gstreamer", "dep:gstreamer-app", "dep:gstreamer-video"]

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
# Cross-checks the someip codec's payloads.
asomeip.workspace = true
rand.workspace = true
# Random valid RTCM messages for round-trip tests.
rtcm-rs = { workspace = true, features = ["test_gen"] }
prost-reflect.workspace = true
protox.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
