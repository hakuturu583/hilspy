[package]
name = "hilspy-core"
description = "Rust core of hilspy: CAN buses (SocketCAN / virtual), DBC, FIBEX, SOME/IP, Septentrio Binary Format (SBF) and LiDAR (Hesai, Velodyne) codecs for HILS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
can-dbc.workspace = true
afibex.workspace = true
roxmltree.workspace = true
libsbf.workspace = true
prost.workspace = true
serialport.workspace = true
nmea.workspace = true
ublox.workspace = true
rtcm-rs.workspace = true
serde_json.workspace = true
autosar-e2e.workspace = true
blf_asc.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
socketcan.workspace = true
libc = "0.2"

[build-dependencies]
prost-build.workspace = true
protox.workspace = true

[dev-dependencies]
# Cross-checks the someip codec's payloads.
asomeip.workspace = true
rand.workspace = true
# Random valid RTCM messages for round-trip tests.
rtcm-rs = { workspace = true, features = ["test_gen"] }
prost-reflect.workspace = true
protox.workspace = true
