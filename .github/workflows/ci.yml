name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test -p hilspy-core

  python:
    name: python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync
      - run: uv run pytest -v
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  socketcan:
    # The SocketCAN backend against a real kernel interface (vcan, CAN FD MTU).
    name: socketcan (vcan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # The packaged vcan playbook (ansible-runner), as `scenario-hils --setup` runs it.
      - run: uv sync --only-group setup
      - name: Create vcan0 (CAN FD MTU) with the setup command
        run: uv run --no-sync tools/setup_host.py --vcan vcan0:fd --no-v4l2
      - name: Check vcan0, and that setting it up again changes nothing
        run: |
          ip -details link show vcan0 | tee link.txt
          grep -q "mtu 72" link.txt
          uv run --no-sync tools/setup_host.py --vcan vcan0:fd --no-v4l2 | tee again.txt
          grep -q "changed=0" again.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync
      - name: Run the SocketCAN tests (and fail if they were skipped)
        env:
          HILSPY_TEST_VCAN: vcan0
        run: |
          uv run pytest -v -rs tests/test_socketcan.py | tee result.txt
          ! grep -qi skipped result.txt

  v4l2:
    # v4l2:// into a v4l2loopback device, the host set up by the setup command.
    # amd64 and arm64: in-vehicle computers are often ARM.
    name: v4l2 (v4l2loopback, GStreamer, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, os: ubuntu-latest }
          - { arch: arm64, os: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      # Only ansible-runner here: --build then builds the extension once,
      # with the feature.
      - run: uv sync --only-group setup
      - name: Set up the host (ansible-runner) and build with the v4l2 feature
        run: uv run --no-sync tools/setup_host.py --build
      - name: Show the device
        # -d: without it v4l2-ctl also opens /dev/video0, which is not there.
        # sg: the setup added the runner to `video`; sg applies it without a new login.
        run: sg video -c "v4l2-ctl -d /dev/video10 --info"
      - if: matrix.arch == 'amd64'  # same code on arm64
        run: cargo clippy --all-targets --features hilspy-core/v4l2 -- -D warnings
      - run: cargo test -p hilspy-core --features v4l2
      - name: Run the v4l2 tests (and fail if they were skipped)
        env:
          HILSPY_TEST_V4L2: /dev/video10
        run: |
          sg video -c "uv run --no-sync pytest -v -rs tests/test_v4l2.py" | tee result.txt
          ! grep -qi skipped result.txt

  dist:
    uses: ./.github/workflows/build-dist.yml

  dashboard:
    # Built for amd64 and arm64 and smoke-tested; pushed only by the release.
    permissions:
      contents: read
      packages: write  # what the reusable workflow declares; CI never pushes
    uses: ./.github/workflows/dashboard.yml
